<style>
:root{--paper:#f2efe9;--white:#fbfaf7;--ink:#121212;--muted:#5f5a54;--line:#d8d2c8;--red:#c8281e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 Literata,Georgia,serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%;display:block}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0;line-height:.95;font-weight:900}
.label{font:700 11px/1 Inter,sans-serif;letter-spacing:2.4px;text-transform:uppercase}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--ink)}
.nav{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.navlinks{display:flex;gap:24px;font:600 13px Inter,sans-serif}
.navlinks a:hover{color:var(--red)}
.brand{display:flex;align-items:center;gap:10px;justify-self:center}
.brand svg{width:40px;height:40px}
.brand b{font:900 22px/1 'Playfair Display',serif;letter-spacing:-.3px}
.navright{display:flex;align-items:center;gap:14px;justify-self:end}
.langs{display:flex;gap:10px;font:700 12px Inter,sans-serif;letter-spacing:1px}
.langs button{border:0;background:none;padding:4px 0;color:var(--muted);border-bottom:2px solid transparent}
.langs button.active{color:var(--ink);border-color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:var(--ink);color:var(--white);font:600 13px Inter,sans-serif;letter-spacing:1.2px;text-transform:uppercase;border:0;transition:background .2s}
.btn:hover{background:var(--red)}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.out:hover{background:var(--ink);color:var(--white)}
.btn.small{padding:10px 16px;font-size:11px}
.mobile-toggle{display:none;border:1.5px solid var(--ink);background:none;width:40px;height:40px;font-size:17px}

/* cover */
.cover{position:relative;min-height:min(92vh,880px);color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-bottom:1px solid var(--ink)}
.cover-bg{position:absolute;inset:0;background:url(assets/hero-table.jpg) 55% 70%/cover}
.cover-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 40%,rgba(0,0,0,.65))}
.cover .wrap{position:relative}
.issue{display:flex;justify-content:space-between;gap:20px;padding:22px 0 10px;border-bottom:1px solid rgba(255,255,255,.6)}
.masthead{font:900 clamp(64px,15vw,230px)/.82 'Playfair Display',serif;letter-spacing:-.04em;margin:14px 0 0;text-transform:uppercase}
.cover-bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:end;padding-bottom:40px}
.cover h1{font-size:clamp(34px,4.6vw,64px);font-weight:800;font-style:italic;max-width:700px}
.coverlines{display:grid;gap:14px;justify-self:end;max-width:380px}
.coverline{border-top:1px solid rgba(255,255,255,.6);padding-top:10px}
.coverline .label{color:#ffcf6b}
.coverline p{margin:4px 0 0;font-size:16px;line-height:1.4}

/* intro / toc */
.intro{padding:90px 0 60px;display:grid;grid-template-columns:1fr 1.3fr;gap:60px;border-bottom:1px solid var(--line)}
.intro h2{font-size:clamp(40px,5vw,72px)}
.intro .lead:first-letter{float:left;font:900 86px/.8 'Playfair Display',serif;margin:8px 12px 0 0;color:var(--red)}
.intro .lead{font-size:19px;margin:0 0 24px}
.toc{margin-top:26px}
.toc .label{color:var(--red)}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;border-top:1px solid var(--ink)}
.tabs button{border:0;border-bottom:1px solid var(--line);background:none;padding:14px 18px 14px 0;font:700 14px Inter,sans-serif;color:var(--muted);flex:1 1 auto;text-align:left;transition:color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}

/* spreads */
.dish{display:grid;grid-template-columns:1fr 1fr;min-height:560px;border-bottom:1px solid var(--ink);background:var(--white)}
.dish:nth-child(even) .ph{order:2}
.dish .ph{position:relative;overflow:hidden;padding:48px;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.dish .ph img{width:100%;max-width:520px;aspect-ratio:4/3;object-fit:cover;box-shadow:0 30px 50px -30px rgba(0,0,0,.5);transition:transform 1.2s}
.dish:hover .ph img{transform:scale(1.04)}
.dish .ph .cap{position:absolute;left:48px;bottom:16px;color:var(--muted);font:italic 14px Literata,serif}
.dish .txt{padding:60px clamp(24px,5vw,80px);display:flex;flex-direction:column;justify-content:center;position:relative}
.dish .num{position:absolute;top:28px;right:clamp(24px,4vw,60px);font:900 clamp(90px,12vw,180px)/.8 'Playfair Display',serif;color:transparent;-webkit-text-stroke:1.5px var(--line)}
.dish .kick{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.dish .kick .label:first-child{color:var(--red)}
.dish .kick i{width:30px;height:1px;background:var(--ink)}
.dish h3{font-size:clamp(46px,5.6vw,86px);letter-spacing:-.02em;margin-bottom:22px;position:relative}
.dish .desc{font-size:19px;font-style:italic;color:var(--muted);margin:0 0 18px;max-width:520px}
.dish .story{margin:0 0 26px;max-width:540px;columns:1}
.dish .meta{display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.dish .meta div{font-size:14px}
.dish .meta .label{display:block;color:var(--muted);margin-bottom:6px}

.more{padding:70px 0;border-bottom:1px solid var(--ink)}
.more .grid{display:grid;grid-template-columns:300px 1fr;gap:40px}
.more h3{font-size:44px}
.more ul{list-style:none;margin:0;padding:0;columns:3;column-gap:30px;column-rule:1px solid var(--line)}
.more li{padding:6px 0;break-inside:avoid;font-size:17px}
.more .note{margin:14px 0 0;color:var(--muted);font-style:italic;font-size:15px}

.quote{padding:110px 0;text-align:center;border-bottom:1px solid var(--ink)}
.quote blockquote{margin:0 auto;max-width:980px;font:italic 700 clamp(32px,4.6vw,64px)/1.1 'Playfair Display',serif}
.quote blockquote:before{content:"“";display:block;font-size:1.8em;line-height:.6;color:var(--red)}
.quote .about{max-width:680px;margin:34px auto 0;color:var(--muted)}
.quote .values{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:30px}

.visit{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ink)}
.visit .txt{padding:80px clamp(24px,5vw,80px)}
.visit h2{font-size:clamp(40px,5vw,72px);margin:18px 0 18px}
.visit p{color:var(--muted)}
.details{margin:28px 0 34px;border-top:1px solid var(--ink)}
.detail{display:grid;grid-template-columns:160px 1fr;padding:14px 0;border-bottom:1px solid var(--line)}
.detail b{font:700 11px/1.9 Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.visit .ph{background:url(assets/bograch.jpg) center/cover;min-height:440px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
footer{padding:34px 0 46px;font:500 13px Inter,sans-serif;color:var(--muted)}
footer .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .fb{font:900 26px 'Playfair Display',serif;color:var(--ink);text-transform:uppercase;letter-spacing:-.02em}
footer nav{display:flex;gap:20px}
footer nav a:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

@media (max-width:1000px){
  .nav{grid-template-columns:auto 1fr;}
  .brand{justify-self:start;order:-1}
  .navlinks{position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--paper);padding:6px 16px 16px;border-bottom:1px solid var(--ink);display:none}
  .navlinks.open{display:flex}.navlinks a{padding:14px 0;border-bottom:1px solid var(--line)}
  .mobile-toggle{display:block}
  .cover-bottom,.intro,.visit,.more .grid{grid-template-columns:1fr}
  .coverlines{justify-self:start}
  .dish{grid-template-columns:1fr;min-height:0}
  .dish .ph{order:0!important;padding:24px 16px 40px}.dish .ph .cap{left:16px;bottom:12px}
  .more ul{columns:2}
}
@media (max-width:640px){
  .navright .btn{display:none}
  .brand b{font-size:18px}
  .cover{min-height:640px}
  .coverlines{display:none}
  .issue{font-size:9px}
  .dish .txt{padding:40px 20px}
  .detail{grid-template-columns:1fr}
  .more ul{columns:1}
  .intro{padding:60px 0 40px;gap:30px}
  .visit .txt{padding:50px 20px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script>
var STORIES = {
  borsch: { uk: "Борщ в Україні — це не одна страва, а сотні рецептів: у кожному регіоні й навіть у кожній родині свій. У 2022 році культуру приготування українського борщу внесли до списку нематеріальної спадщини ЮНЕСКО.", pl: "Barszcz w Ukrainie to nie jedno danie, lecz setki przepisów — każdy region i każda rodzina ma swój. W 2022 roku kultura gotowania ukraińskiego barszczu trafiła na listę niematerialnego dziedzictwa UNESCO.", en: "In Ukraine borscht isn’t one dish but hundreds of recipes — every region and every family has its own. In 2022 the culture of cooking Ukrainian borscht was inscribed on UNESCO’s intangible heritage list." },
  varenyky: { uk: "Вареники ліплять гуртом — за спільним столом, з розмовами й сміхом. Картопля, капуста, гриби, сир: начинка змінюється, а відчуття дому лишається.", pl: "Pierogi lepi się razem — przy wspólnym stole, z rozmową i śmiechem. Ziemniaki, kapusta, grzyby, twaróg: farsz się zmienia, a smak domu zostaje.", en: "Varenyky are made together — around one table, with talk and laughter. Potato, cabbage, mushrooms, cheese: the filling changes, the feeling of home stays." },
  bograch: { uk: "Бограч прийшов із Закарпаття, де його готують у казані просто неба. Густий, гостренький, з паприкою — страва для холодного вечора й великої компанії.", pl: "Bogracz pochodzi z Zakarpacia, gdzie gotuje się go w kociołku pod gołym niebem. Gęsty, pikantny, z papryką — na chłodny wieczór i duże towarzystwo.", en: "Bograch comes from Transcarpathia, where it is cooked in a cauldron over an open fire. Thick, spicy and full of paprika — made for cold evenings and big company." },
  deruny: { uk: "Деруни — улюблена страва Полісся. Свіжотерта картопля, гаряча сковорідка і ложка сметани — простіше не буває, смачніше теж.", pl: "Deruny to ulubione danie Polesia. Świeżo starte ziemniaki, gorąca patelnia i łyżka śmietany — prościej się nie da, smaczniej też nie.", en: "Deruny are the pride of Polissia. Freshly grated potato, a hot pan and a spoon of sour cream — nothing simpler, nothing better." },
  holubtsi: { uk: "Голубці — святкова страва, яку готують на родинні свята. Повільне тушкування в томатному соусі робить їх особливо ніжними.", pl: "Gołąbki to świąteczne danie na rodzinne uroczystości. Powolne duszenie w sosie pomidorowym sprawia, że są wyjątkowo delikatne.", en: "Holubtsi are a festive dish for family celebrations. Slow braising in tomato sauce makes them especially tender." },
  pampushky: { uk: "Без пампушок борщ — не борщ. Гарячі булочки змащують часниковою олією із зеленню й подають одразу — поки пахнуть на всю залу.", pl: "Bez pampuszek barszcz to nie barszcz. Gorące bułeczki smaruje się olejem czosnkowym z ziołami i podaje od razu — póki pachną na całą salę.", en: "Borscht isn’t borscht without pampushky. Hot buns are brushed with garlic-herb oil and served straight away — while the whole room smells of them." }
};
var PAIR = {
  borsch: { uk: "Пампушки, сало", pl: "Pampuszki, słonina", en: "Pampushky, salo" },
  varenyky: { uk: "Сметана, шкварки", pl: "Śmietana, skwarki", en: "Sour cream, crackling" },
  bograch: { uk: "Свіжий хліб", pl: "Świeży chleb", en: "Fresh bread" },

  holubtsi: { uk: "Сметана, зелень", pl: "Śmietana, zioła", en: "Sour cream, herbs" },

};

          cl1k: "Головна тема", cl1: "Чому борщ — це спадщина ЮНЕСКО", cl2k: "Закарпаття", cl2: "Бограч: казан, вогонь і паприка", cl3k: "Традиція", cl3: "Вареники, які ліплять разом" },

  },
  card: function (d, t, l, i) {
    return '<div class="ph"><img loading="lazy" src="' + d.img + '" alt="' + d.name[l] + '"><span class="cap">' + d.name[l] + ' — Ukraińska Knajpa</span></div>' +
      '<div class="txt"><span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
      '<div class="kick"><span class="label">' + d.tag[l] + '</span><i></i><span class="label">' + t[d.badge] + '</span></div>' +
      '<h3>' + d.name[l] + '</h3><p class="desc">' + d.desc[l] + '</p><p class="story">' + STORIES[d.id][l] + '</p>' +
      '<div class="meta"><div><span class="label">' + t.pairLabel + '</span>' + PAIR[d.id][l] + '</div><div><span class="label">' + t.catLabel + '</span>' + t[d.cat] + '</div><div><span class="label">·</span>' + t.ask + '</div></div></div>';
  }
};
</script>
<script src="site.js"></script>
<script src="../booking/booking.js"></script>
</body>
